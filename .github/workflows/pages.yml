name: Terbitkan situs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan satu penerbitan selesai sebelum yang berikutnya mulai.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bangun situs dari sumber edisi
        run: python3 scripts/build.py

      - name: Periksa hasil build
        run: |
          test -f index.html || { echo "index.html tidak terbentuk"; exit 1; }
          test -f arsip.html || { echo "arsip.html tidak terbentuk"; exit 1; }
          echo "Edisi terbangun: $(ls editions/*.html | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
